apiVersion: v1
kind: Namespace
metadata:
  labels:
    kubernetes.io/metadata.name: docker-registry
  name: docker-registry
spec:
  finalizers:
  - kubernetes

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: docker-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
        env:
        # No need for authentication in a local setup, but you can enable it if desired
        # - name: REGISTRY_AUTH
        #   value: "htpasswd"
        # - name: REGISTRY_AUTH_HTPASSWD_REALM
        #   value: "Registry Realm"
        # - name: REGISTRY_AUTH_HTPASSWD_PATH
        #   value: "/auth/htpasswd"
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: "/var/lib/registry"
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
        # No need for authentication in a local setup, but you can enable it if desired
        # - name: auth-volume
        #   mountPath: /auth
        #   readOnly: true
      volumes:
      - name: registry-data
        persistentVolumeClaim:
          claimName: registry-pvc
      # No need for authentication in a local setup, but you can enable it if desired
      # - name: auth-volume
      #   secret:
      #     secretName: registry-auth

---

apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: docker-registry
  labels:
    app: registry
spec:
  # The Gateway API (HTTPRoute) or Ingress points to this port
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP
  # This MUST match the labels in your Deployment template
  selector:
    app: registry
  type: ClusterIP

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: registry-gateway
  namespace: docker-registry
spec:
  gatewayClassName: ck-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry-route
  namespace: docker-registry
spec:
  parentRefs:
  - name: registry-gateway
  hostnames:
  - "docker-registry.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: registry-service
      port: 5000
